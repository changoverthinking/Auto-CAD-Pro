name: Windows CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require PR branch to include latest main
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "PR branch is behind main. Rebase/merge latest main before integration to prevent regression reintroduction."
          }

      - name: Configure
        run: cmake -S . -B build -A x64 -DACP_BUILD_TESTS=ON -DACP_BUILD_APP=ON -DACP_ENABLE_GUI_TEST_HOOKS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Repeat core regression suite
        run: ctest --test-dir build -C Release --repeat until-fail:5 --output-on-failure

      - name: Launch GUI and capture real window
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindow {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@

          $exe = Join-Path $PWD "build\Release\AutoCADPro.exe"
          if (!(Test-Path $exe)) { throw "AutoCADPro.exe was not produced" }

          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $proc.Refresh()
            } while ($proc.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

            if ($proc.HasExited) {
              throw "AutoCADPro exited before a main window appeared. ExitCode=$($proc.ExitCode)"
            }
            if ($proc.MainWindowHandle -eq 0) {
              throw "AutoCADPro did not create a visible main window"
            }

            [NativeWindow]::ShowWindow($proc.MainWindowHandle, 3) | Out-Null
            [NativeWindow]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 2

            $rect = New-Object NativeWindow+RECT
            if (![NativeWindow]::GetWindowRect($proc.MainWindowHandle, [ref]$rect)) {
              throw "GetWindowRect failed"
            }

            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 640 -or $height -lt 480) {
              throw ("Unexpected GUI size: " + $width + "x" + $height)
            }

            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $bitmap = New-Object System.Drawing.Bitmap $width, $height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
              $bitmap.Save((Join-Path $PWD "artifacts\AutoCADPro-real-ui.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            if (!(Test-Path "artifacts\AutoCADPro-real-ui.png")) {
              throw "GUI screenshot was not created"
            }
          }
          finally {
            if (!$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Repeated GUI lifecycle smoke
        shell: powershell
        run: |
          $exe = Join-Path $PWD "build\Release\AutoCADPro.exe"
          1..3 | ForEach-Object {
            $proc = Start-Process -FilePath $exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(15)
              do {
                Start-Sleep -Milliseconds 300
                $proc.Refresh()
              } while ($proc.MainWindowHandle -eq 0 -and !$proc.HasExited -and (Get-Date) -lt $deadline)

              if ($proc.HasExited) {
                throw "GUI lifecycle run $_ exited before creating a main window. ExitCode=$($proc.ExitCode)"
              }
              if ($proc.MainWindowHandle -eq 0) {
                throw "GUI lifecycle run $_ did not create a main window"
              }
            }
            finally {
              if (!$proc.HasExited) {
                Stop-Process -Id $proc.Id -Force
              }
            }
          }

      - name: GUI interaction regression
        shell: powershell
        run: .\tests\gui_interaction_smoke.ps1 -Exe (Join-Path $PWD "build\Release\AutoCADPro.exe")

      - name: GUI edit-tools regression
        shell: powershell
        run: .\tests\gui_edit_tools_smoke.ps1 -Exe (Join-Path $PWD "build\Release\AutoCADPro.exe")

      - name: GUI layout dirty-state regression
        shell: powershell
        run: .\tests\gui_layout_dirty_smoke.ps1 -Exe (Join-Path $PWD "build\Release\AutoCADPro.exe")

      - name: GUI direct property editor regression
        shell: powershell
        run: .\tests\gui_property_editor_smoke.ps1 -Exe (Join-Path $PWD "build\Release\AutoCADPro.exe")

      - name: Upload GUI edit-tools snapshots
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-GUI-Edit-Tool-Snapshots
          path: |
            artifacts/gui-interaction-2*.acp2d
            artifacts/gui-interaction-3*.acp2d
          if-no-files-found: error

      - name: Upload GUI interaction snapshots
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-GUI-Interaction-Snapshots
          path: artifacts/gui-interaction-*.acp2d
          if-no-files-found: error

      - name: Upload real GUI screenshot
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-Real-UI
          path: artifacts/AutoCADPro-real-ui.png
          if-no-files-found: error

      - name: Build versioned portable package
        shell: powershell
        run: |
          cpack --config build\CPackConfig.cmake -C Release -G ZIP
          $package = Get-ChildItem -Path . -Filter "AutoCADPro-*-Windows-x64.zip" | Select-Object -First 1
          if ($null -eq $package) {
            throw "Versioned AutoCADPro ZIP package was not created"
          }
          $hash = Get-FileHash -Algorithm SHA256 -Path $package.FullName
          ($hash.Hash.ToLower() + "  " + $package.Name) | Set-Content -NoNewline -Path ($package.FullName + ".sha256")

          $portableCheck = Join-Path $env:RUNNER_TEMP "autocadpro-portable-check"
          Remove-Item $portableCheck -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $package.FullName -DestinationPath $portableCheck
          $portableExe = Get-ChildItem $portableCheck -Recurse -Filter AutoCADPro.exe | Select-Object -First 1
          $portableFont = Get-ChildItem $portableCheck -Recurse -Filter NotoSansJP.ttf | Select-Object -First 1
          $portableNotoLicense = Get-ChildItem $portableCheck -Recurse -Filter OFL.txt | Select-Object -First 1
          $portableStbLicense = Get-ChildItem $portableCheck -Recurse -Filter LICENSE | Where-Object { $_.FullName -match 'licenses\\stb' } | Select-Object -First 1
          if ($null -eq $portableExe -or $null -eq $portableFont -or $null -eq $portableNotoLicense -or $null -eq $portableStbLicense) {
            throw "Portable package is missing executable, Unicode font, or license assets"
          }

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-Windows-x64-Portable
          path: |
            AutoCADPro-*-Windows-x64.zip
            AutoCADPro-*-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Validate NSIS installer build
        shell: powershell
        run: |
          if ($null -eq (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if ($null -eq (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          if ($null -eq (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "makensis.exe is not available"
          }

          New-Item -ItemType Directory -Force -Path installer-artifacts | Out-Null
          $versionLine = Select-String -Path CMakeLists.txt -Pattern 'project\(AutoCADPro VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if ($null -eq $versionLine) { throw "Could not determine project version" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $exe = (Resolve-Path "build\Release\AutoCADPro.exe").Path
          $readme = (Resolve-Path "README.md").Path
          $font = (Resolve-Path "build\assets\NotoSansJP.ttf").Path
          $notoLicense = (Resolve-Path "third_party\noto\OFL.txt").Path
          $notoSource = (Resolve-Path "third_party\noto\SOURCE.md").Path
          $stbLicense = (Resolve-Path "third_party\stb\LICENSE").Path
          $out = (Resolve-Path "installer-artifacts").Path
          & makensis.exe "/DVERSION=$version" "/DSOURCE_EXE=$exe" "/DREADME_FILE=$readme" "/DPDF_FONT_FILE=$font" "/DNOTO_LICENSE_FILE=$notoLicense" "/DNOTO_SOURCE_FILE=$notoSource" "/DSTB_LICENSE_FILE=$stbLicense" "/DOUTPUT_DIR=$out" "installer\AutoCADPro.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          $installer = Get-ChildItem -Path installer-artifacts -Filter "AutoCADPro-*-Windows-x64-Setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Installer was not created" }

          $installRoot = Join-Path $env:RUNNER_TEMP "AutoCADProInstallerSmoke"
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent installer smoke failed with exit code $($install.ExitCode)" }
          foreach ($required in @(
            (Join-Path $installRoot "AutoCADPro.exe"),
            (Join-Path $installRoot "assets\NotoSansJP.ttf"),
            (Join-Path $installRoot "licenses\NotoSansJP\OFL.txt"),
            (Join-Path $installRoot "licenses\NotoSansJP\SOURCE.md"),
            (Join-Path $installRoot "licenses\stb\LICENSE"),
            (Join-Path $installRoot "Uninstall.exe")
          )) {
            if (!(Test-Path $required)) { throw "Installed package is missing: $required" }
          }

          $installedProc = Start-Process -FilePath (Join-Path $installRoot "AutoCADPro.exe") -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 300
              $installedProc.Refresh()
            } while ($installedProc.MainWindowHandle -eq 0 -and !$installedProc.HasExited -and (Get-Date) -lt $deadline)
            if ($installedProc.HasExited -or $installedProc.MainWindowHandle -eq 0) {
              throw "Installed AutoCADPro.exe did not launch successfully"
            }
          }
          finally {
            if (!$installedProc.HasExited) { Stop-Process -Id $installedProc.Id -Force }
          }

          $uninstall = Start-Process -FilePath (Join-Path $installRoot "Uninstall.exe") -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall smoke failed with exit code $($uninstall.ExitCode)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-Windows-x64-Installer
          path: installer-artifacts/AutoCADPro-*-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: Stage standalone Windows application
        shell: powershell
        run: |
          Remove-Item application-artifacts -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path application-artifacts\assets | Out-Null
          New-Item -ItemType Directory -Force -Path application-artifacts\licenses\NotoSansJP | Out-Null
          New-Item -ItemType Directory -Force -Path application-artifacts\licenses\stb | Out-Null
          Copy-Item build\Release\AutoCADPro.exe application-artifacts\AutoCADPro.exe
          Copy-Item build\assets\NotoSansJP.ttf application-artifacts\assets\NotoSansJP.ttf
          Copy-Item third_party\noto\OFL.txt application-artifacts\licenses\NotoSansJP\OFL.txt
          Copy-Item third_party\noto\SOURCE.md application-artifacts\licenses\NotoSansJP\SOURCE.md
          Copy-Item third_party\stb\LICENSE application-artifacts\licenses\stb\LICENSE

      - name: Upload Windows application
        uses: actions/upload-artifact@v6
        with:
          name: AutoCADPro-Windows-x64
          path: application-artifacts/**
          if-no-files-found: error
