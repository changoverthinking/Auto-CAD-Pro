name: Apply Architectural GUI Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-gui-architecture-patch.yml"
      - "tools/patch_ci_architecture.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact CI screenshot patch
        run: python tools/patch_ci_architecture.py
      - name: Verify screenshot capture markers
        run: |
          grep -q 'AutoCADPro-architectural-3d-ui.png' .github/workflows/windows-ci.yml
          grep -q 'architectural3DMessage' .github/workflows/windows-ci.yml
          grep -q 'SendMessage' .github/workflows/windows-ci.yml
      - name: Commit patched Windows CI
        run: |
          if git diff --quiet -- .github/workflows/windows-ci.yml; then
            echo "No Windows CI patch changes to commit"
            exit 0
          fi
          git config user.name "Auto CAD Pro CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/windows-ci.yml
          git commit -m "Capture real Architectural 3D workspace in CI"
          git push origin HEAD:main
