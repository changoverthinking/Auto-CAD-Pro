name: Apply Architectural GUI Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-gui-architecture-patch.yml"
      - "tools/patch_gui_architecture.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact source patch
        run: python tools/patch_gui_architecture.py
      - name: Verify patch markers
        run: |
          grep -q 'architecture3d_builder.hpp' src/app/main_win.cpp
          grep -q 'SceneRevisionCache scene3d_cache' src/app/main_win.cpp
          grep -q 'Build Architectural 3D' src/app/main_win.cpp
          grep -q 'kGuiTestArchitectural3DMessage' src/app/main_win.cpp
          ! grep -q 'scene3d_dirty' src/app/main_win.cpp
      - name: Commit patched GUI source
        run: |
          if git diff --quiet -- src/app/main_win.cpp; then
            echo "No GUI patch changes to commit"
            exit 0
          fi
          git config user.name "Auto CAD Pro CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/main_win.cpp
          git commit -m "Integrate architectural 3D builder into native GUI"
          git push origin HEAD:main
